<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="500" height="340">
  <!-- Exact PFP logo as uploaded - black P, gold F, black P overlapping -->
  <style>
    .serif { font-family: 'Times New Roman', Times, serif; font-weight: 400; }
  </style>
  <!-- First P - large black, left -->
  <text x="15" y="280" font-family="Playfair Display, Times New Roman, serif" font-size="340" font-weight="700" fill="#000000" letter-spacing="-15">P</text>
  <!-- Middle F - gold, center, slightly smaller, overlapping -->
  <text x="165" y="280" font-family="Playfair Display, Times New Roman, serif" font-size="260" font-weight="700" fill="#C2A265" letter-spacing="-5">F</text>
  <!-- Last P - large black, right -->
  <text x="285" y="280" font-family="Playfair Display, Times New Roman, serif" font-size="340" font-weight="700" fill="#000000" letter-spacing="-15">P</text>
</svg>
